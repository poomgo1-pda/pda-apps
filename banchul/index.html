<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>반출 스캔</title>
<meta name="theme-color" content="#1f4e78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  // ▼▼▼ 여기에 Apps Script 웹앱 주소(끝이 /exec)를 붙여넣으세요 ▼▼▼
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwLB5ksOuyiOICUwkFZoU49IpgHW7CdfBXKqRHwDQYdi8JZ0v3r2CxhqrnEyPJU2rUO/exec';
  // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲
</script>
<style>
  html,body{margin:0;height:100%;background:#fff;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  #menuBtn{position:fixed;right:8px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:10;width:40px;height:40px;border-radius:20px;border:none;
    background:#1f4e78;color:#fff;font-size:20px;opacity:.55;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  #menu{position:fixed;right:8px;bottom:calc(58px + env(safe-area-inset-bottom));z-index:11;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.3);display:none;overflow:hidden;min-width:220px}
  #menu.on{display:block}
  #menu button{display:block;width:100%;padding:14px 16px;border:none;background:#fff;text-align:left;font-size:15px;border-bottom:1px solid #eee}
  #menu .tip{padding:10px 16px;font-size:12px;color:#777;line-height:1.5}
  #setup{display:none;padding:24px;line-height:1.6}
  #setup h2{color:#1f4e78}
  #setup code{background:#f2f2f2;padding:2px 6px;border-radius:4px;word-break:break-all}
</style>
</head>
<body>
<div id="setup">
  <h2>반출 스캔 · 설정 필요</h2>
  <p>이 파일(<code>index.html</code>) 안의 <code>APP_URL</code> 에 Apps Script 웹앱 주소(끝이 <code>/exec</code>)를 붙여넣어 주세요.</p>
</div>
<iframe id="app" allow="camera; microphone; clipboard-read; clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
<button id="menuBtn" aria-label="메뉴">⋯</button>
<div id="menu">
  <button onclick="reloadApp()">↻ 앱 새로고침</button>
  <button onclick="openBrowser()">🌐 브라우저에서 열기 (로그인·화면이 안 나올 때)</button>
  <div class="tip">화면이 하얗게 나오거나 '열 수 없음'이 뜨면 → [브라우저에서 열기]로 구글 로그인을 한 번 한 뒤 이 앱을 다시 켜 주세요.</div>
</div>
<script>
  var ok = /^https:\/\/script\.google\.com\/.+\/exec/.test(APP_URL);
  var fr = document.getElementById('app');
  if (!ok) { document.getElementById('setup').style.display = 'block'; fr.style.display = 'none'; }
  else fr.src = APP_URL;
  function reloadApp(){ toggle(false); fr.src = 'about:blank'; setTimeout(function(){ fr.src = APP_URL; }, 50); }
  function openBrowser(){ toggle(false); window.open(APP_URL, '_blank'); }
  function toggle(on){ document.getElementById('menu').classList.toggle('on', on); }
  document.getElementById('menuBtn').onclick = function(){ toggle(!document.getElementById('menu').classList.contains('on')); };
  fr.addEventListener('load', function(){ toggle(false); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
